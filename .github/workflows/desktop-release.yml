name: Publish Windows desktop release

on:
  push:
    tags:
      - "v*-codex.*"

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.12.9"
  PYTHON_EMBED_SHA256: "615861fb801e8b04c847598db4e1e46e4b046295017caa37cb5486dde72b5865"
  PYSTAND_VERSION: "1.1.4"
  PYSTAND_SHA256: "51898744692cba9fd6db2b1212629d5cf04bea15559c80493d6e7d8356d5122a"
  CODEX_VERSION: "0.166.0"
  CODEX_SHA256: "d559bb88e74d471265857b93b7f19bc250dae527673b9191b33534478093f6bc"
  NODE_VERSION: "24.19.0"
  NODE_SHA256: "57f71ab3652e797d84acddc79c81cc9ff1c6ddb2a1974cdb83f00fee9bff4c73"
  INNO_VERSION: "6.7.3"
  INNO_SHA256: "9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732"
  RELEASE_DIRECTORY: "PDFMathTranslate-Codex"
  RELEASE_ASSET: "PDFMathTranslate-Codex-Setup-win64.exe"

jobs:
  build-test-release:
    name: Build, verify, and publish Windows x64 package
    runs-on: windows-latest
    timeout-minutes: 150

    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@f94ec6bedd8674c4426838e6b50417d36b6ab231 # v5.3.1
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Cache BabelDOC assets
        uses: actions/cache@v4
        with:
          path: ~/.cache/babeldoc
          key: desktop-release-babeldoc-${{ hashFiles('uv.lock') }}

      - name: Validate the tag and locked environment
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ("${{ github.ref_name }}" -notmatch '^v\d+\.\d+\.\d+-codex\.\d+(?:\.\d+)?$') {
              throw "Unexpected release tag: ${{ github.ref_name }}"
          }
          uv lock --check
          if ($LASTEXITCODE -ne 0) { throw "Dependency lock validation failed." }
          uv sync --locked --python $env:PYTHON_VERSION
          if ($LASTEXITCODE -ne 0) { throw "Locked test environment setup failed." }

      - name: Run unit tests and formatting checks
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          uv run --locked pytest .
          if ($LASTEXITCODE -ne 0) { throw "Python unit tests failed; release stopped." }
          uv run --locked black --check .
          if ($LASTEXITCODE -ne 0) { throw "Python formatting checks failed; release stopped." }

      - name: Build the clean portable application
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $releaseRoot = Join-Path $env:GITHUB_WORKSPACE "release-staging\$env:RELEASE_DIRECTORY"
          $dependencyRoot = Join-Path $env:GITHUB_WORKSPACE "release-dependencies"
          $runtimeVenv = Join-Path $dependencyRoot "runtime-venv"
          $runtimePython = Join-Path $runtimeVenv "Scripts\python.exe"

          New-Item -Path (Join-Path $releaseRoot "runtime") -ItemType Directory -Force | Out-Null
          New-Item -Path (Join-Path $releaseRoot "licenses") -ItemType Directory -Force | Out-Null
          New-Item -Path $dependencyRoot -ItemType Directory -Force | Out-Null

          function Assert-Sha256([string] $Path, [string] $Expected) {
              $actual = (Get-FileHash -Path $Path -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($actual -ne $Expected.ToLowerInvariant()) {
                  throw "SHA-256 mismatch for $Path. Expected $Expected, got $actual."
              }
          }

          Write-Host "Downloading verified Python embedded runtime $env:PYTHON_VERSION"
          $pythonArchive = Join-Path $dependencyRoot "python-embed.zip"
          $pythonUrl = "https://www.python.org/ftp/python/$env:PYTHON_VERSION/python-$env:PYTHON_VERSION-embed-amd64.zip"
          Invoke-WebRequest -Uri $pythonUrl -OutFile $pythonArchive
          Assert-Sha256 $pythonArchive $env:PYTHON_EMBED_SHA256
          Expand-Archive -Path $pythonArchive -DestinationPath (Join-Path $releaseRoot "runtime") -Force

          Write-Host "Downloading verified PyStand launchers $env:PYSTAND_VERSION"
          $pystandArchive = Join-Path $dependencyRoot "PyStand.zip"
          $pystandUrl = "https://github.com/skywind3000/PyStand/releases/download/$env:PYSTAND_VERSION/PyStand-v$env:PYSTAND_VERSION-exe.zip"
          Invoke-WebRequest -Uri $pystandUrl -OutFile $pystandArchive
          Assert-Sha256 $pystandArchive $env:PYSTAND_SHA256
          $pystandRoot = Join-Path $dependencyRoot "PyStand"
          Expand-Archive -Path $pystandArchive -DestinationPath $pystandRoot -Force
          Copy-Item (Join-Path $pystandRoot "PyStand-x64-CLI\PyStand.exe") (Join-Path $releaseRoot "pdf2zh.exe")
          Copy-Item (Join-Path $pystandRoot "PyStand-x64-GUI\PyStand.exe") (Join-Path $releaseRoot "PDFMathTranslate-Codex.exe")

          Write-Host "Installing the exact dependencies recorded in uv.lock"
          $requirements = Join-Path $dependencyRoot "runtime-requirements.txt"
          uv export --locked --no-dev --extra desktop --no-emit-project --format requirements-txt --output-file $requirements
          if ($LASTEXITCODE -ne 0) { throw "Exporting locked dependencies failed." }
          uv venv $runtimeVenv --python $env:PYTHON_VERSION
          if ($LASTEXITCODE -ne 0) { throw "Creating the runtime environment failed." }
          uv pip install --python $runtimePython --require-hashes -r $requirements
          if ($LASTEXITCODE -ne 0) { throw "Installing locked runtime dependencies failed." }
          uv build --wheel --out-dir (Join-Path $dependencyRoot "dist")
          if ($LASTEXITCODE -ne 0) { throw "Building the application wheel failed." }
          $wheels = @(Get-ChildItem (Join-Path $dependencyRoot "dist") -Filter "*.whl")
          if ($wheels.Count -ne 1) {
              throw "Expected exactly one project wheel, found $($wheels.Count)."
          }
          $wheel = $wheels[0]
          uv pip install --python $runtimePython --no-deps $wheel.FullName
          if ($LASTEXITCODE -ne 0) { throw "Installing the application wheel failed." }
          Copy-Item (Join-Path $runtimeVenv "Lib\site-packages") $releaseRoot -Recurse

          Write-Host "Bundling verified Node.js and locked ChatGPT browser dependencies"
          $nodeArchive = Join-Path $dependencyRoot "node.zip"
          Invoke-WebRequest -Uri "https://nodejs.org/dist/v$env:NODE_VERSION/node-v$env:NODE_VERSION-win-x64.zip" -OutFile $nodeArchive
          Assert-Sha256 $nodeArchive $env:NODE_SHA256
          Expand-Archive -Path $nodeArchive -DestinationPath $dependencyRoot -Force
          $nodeRoot = Join-Path $dependencyRoot "node-v$env:NODE_VERSION-win-x64"
          New-Item -Path (Join-Path $releaseRoot "node") -ItemType Directory -Force | Out-Null
          Copy-Item (Join-Path $nodeRoot "node.exe") (Join-Path $releaseRoot "node\node.exe")
          Copy-Item (Join-Path $nodeRoot "LICENSE") (Join-Path $releaseRoot "licenses\Node-LICENSE.txt")
          $env:PATH = "$nodeRoot;$env:PATH"
          $bridgeRoot = Join-Path $releaseRoot "site-packages\pdf2zh\browser_bridge"
          & (Join-Path $nodeRoot "npm.cmd") ci --omit=dev --prefix $bridgeRoot
          if ($LASTEXITCODE -ne 0) { throw "Installing locked ChatGPT browser dependencies failed." }
          Push-Location $bridgeRoot
          try {
              & (Join-Path $nodeRoot "npm.cmd") test
              if ($LASTEXITCODE -ne 0) { throw "Packaged ChatGPT browser bridge tests failed." }
          }
          finally { Pop-Location }

          Copy-Item "script\_pystand_static.int" $releaseRoot
          Copy-Item "LICENSE" $releaseRoot
          Copy-Item "packaging\Login-Codex.cmd" $releaseRoot
          Copy-Item "packaging\README-Windows.txt" $releaseRoot
          Copy-Item "packaging\README-使用说明.txt" $releaseRoot
          Copy-Item "packaging\OFFLINE-ASSETS-SOURCES.txt" (Join-Path $releaseRoot "licenses")
          Copy-Item (Join-Path $releaseRoot "runtime\LICENSE.txt") (Join-Path $releaseRoot "licenses\Python-3.12.9-LICENSE.txt")

          Write-Host "Generating the BabelDOC offline asset archive"
          & (Join-Path $runtimeVenv "Scripts\babeldoc.exe") --generate-offline-assets $releaseRoot
          if ($LASTEXITCODE -ne 0) {
              throw "BabelDOC offline asset generation failed with exit code $LASTEXITCODE."
          }

          Write-Host "Downloading verified official Codex CLI $env:CODEX_VERSION"
          $codexArchive = Join-Path $dependencyRoot "codex-package.tar.gz"
          $codexUrl = "https://github.com/openai/codex/releases/download/rust-v$env:CODEX_VERSION/codex-package-x86_64-pc-windows-msvc.tar.gz"
          Invoke-WebRequest -Uri $codexUrl -OutFile $codexArchive
          Assert-Sha256 $codexArchive $env:CODEX_SHA256
          # The official package contains bin/, codex-path/, and codex-resources/.
          # Keep those siblings together under the portable target-triple folder
          # that pdf2zh's Codex resolver and Login-Codex.cmd expect.
          $codexRoot = Join-Path $releaseRoot "codex-cli\x86_64-pc-windows-msvc"
          New-Item -Path $codexRoot -ItemType Directory -Force | Out-Null
          tar -xzf $codexArchive -C $codexRoot
          if ($LASTEXITCODE -ne 0) {
              throw "Codex CLI archive extraction failed with exit code $LASTEXITCODE."
          }

          Write-Host "Adding pinned third-party license notices"
          $licenseDownloads = @(
              @{
                  Url = "https://raw.githubusercontent.com/openai/codex/rust-v$env:CODEX_VERSION/LICENSE"
                  Path = (Join-Path $releaseRoot "licenses\Codex-CLI-LICENSE.txt")
                  Sha256 = "d17f227e4df5da1600391338865ce0f3055211760a36688f816941d58232d8dc"
              },
              @{
                  Url = "https://raw.githubusercontent.com/openai/codex/rust-v$env:CODEX_VERSION/NOTICE"
                  Path = (Join-Path $releaseRoot "licenses\Codex-CLI-NOTICE.txt")
                  Sha256 = "9d71575ecfd9a843fc1677b0efb08053c6ba9fd686a0de1a6f5382fd3c220915"
              },
              @{
                  Url = "https://raw.githubusercontent.com/skywind3000/PyStand/$env:PYSTAND_VERSION/LICENSE"
                  Path = (Join-Path $releaseRoot "licenses\PyStand-LICENSE.txt")
                  Sha256 = "5a67e8ca3f851fc7b6a780239b6bda57c856906c7d513c83b8ff3d3e9abbe9b9"
              }
          )
          foreach ($item in $licenseDownloads) {
              Invoke-WebRequest -Uri $item.Url -OutFile $item.Path
              Assert-Sha256 $item.Path $item.Sha256
          }

          $sourceUrl = "https://github.com/$env:GITHUB_REPOSITORY/tree/${{ github.ref_name }}"
          $sourceArchive = "https://github.com/$env:GITHUB_REPOSITORY/archive/refs/tags/${{ github.ref_name }}.zip"
          @(
              "PDFMathTranslate Codex Edition build information",
              "Release tag: ${{ github.ref_name }}",
              "Source commit: $env:GITHUB_SHA",
              "Source: $sourceUrl",
              "GitHub Actions run: https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID",
              "Python embedded runtime: $env:PYTHON_VERSION",
              "PyStand: $env:PYSTAND_VERSION",
              "Bundled official Codex CLI: $env:CODEX_VERSION",
              "Bundled Node.js: $env:NODE_VERSION",
              "Dependencies: uv.lock from the source tag",
              "Build host: GitHub-hosted windows-latest"
          ) | Set-Content -Path (Join-Path $releaseRoot "BUILD-INFO.txt") -Encoding utf8
          @(
              "The complete corresponding source for this binary release is available at:",
              $sourceUrl,
              "",
              "Download the source archive:",
              $sourceArchive,
              "",
              "Exact Git commit:",
              $env:GITHUB_SHA
          ) | Set-Content -Path (Join-Path $releaseRoot "SOURCE-CODE.txt") -Encoding utf8

      - name: Verify package contents and launchers
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $releaseRoot = Join-Path $env:GITHUB_WORKSPACE "release-staging\$env:RELEASE_DIRECTORY"
          $codex = Join-Path $releaseRoot "codex-cli\x86_64-pc-windows-msvc\bin\codex.exe"
          if (-not (Test-Path $codex -PathType Leaf)) {
              throw "Bundled Codex CLI executable is missing from its portable path: $codex"
          }
          foreach ($helper in @("codex-code-mode-host.exe", "codex-exec-server.exe")) {
              if (-not (Test-Path (Join-Path (Split-Path $codex -Parent) $helper) -PathType Leaf)) {
                  throw "Bundled Codex companion is missing: $helper"
              }
          }

          $requiredTopLevel = @(
              "PDFMathTranslate-Codex.exe",
              "pdf2zh.exe",
              "_pystand_static.int",
              "runtime",
              "site-packages",
              "codex-cli",
              "node",
              "Login-Codex.cmd",
              "README-Windows.txt",
              "README-使用说明.txt",
              "BUILD-INFO.txt",
              "SOURCE-CODE.txt",
              "LICENSE",
              "licenses"
          )
          foreach ($name in $requiredTopLevel) {
              if (-not (Test-Path (Join-Path $releaseRoot $name))) {
                  throw "Required release item is missing: $name"
              }
          }

          $topLevelItems = @(Get-ChildItem $releaseRoot -Force)
          foreach ($item in $topLevelItems) {
              if ($item.Name -in $requiredTopLevel) { continue }
              if (-not $item.PSIsContainer -and $item.Name -like "offline_assets_*.zip") { continue }
              throw "Unexpected top-level item in clean release: $($item.Name)"
          }

          $offlineAssets = @(Get-ChildItem $releaseRoot -Filter "offline_assets_*.zip" -File)
          if ($offlineAssets.Count -ne 1 -or $offlineAssets[0].Length -le 0) {
              throw "Expected exactly one non-empty BabelDOC offline asset archive."
          }
          $assetListing = tar -tf $offlineAssets[0].FullName
          if ($LASTEXITCODE -ne 0) {
              throw "Could not inspect the generated offline asset archive."
          }
          foreach ($pattern in @("models/doclayout_", "models/ch_PP-OCR", "fonts/SourceHan")) {
              if (-not ($assetListing | Select-String -SimpleMatch $pattern)) {
                  throw "Offline assets are missing required content matching: $pattern"
              }
          }

          $forbidden = @(Get-ChildItem $releaseRoot -Recurse -Force | Where-Object {
              $_.Name -in @("auth.json", ".codex", "pdf2zh_files", ".env") -or
              $_.Name -like ".env.*" -or
              $_.Extension -in @(".pdf", ".db", ".sqlite", ".sqlite3")
          })
          if ($forbidden.Count -gt 0) {
              $paths = ($forbidden.FullName -join "`n")
              throw "Forbidden private or user-document content found in release:`n$paths"
          }

          $versionOutput = & (Join-Path $releaseRoot "pdf2zh.exe") --version
          if ($LASTEXITCODE -ne 0) {
              throw "pdf2zh.exe --version failed with exit code $LASTEXITCODE."
          }
          $appVersion = Get-Content (Join-Path $releaseRoot "site-packages\pdf2zh\version.py") -Raw
          if (-not $appVersion.Contains('APP_VERSION = "${{ github.ref_name }}"')) {
              throw "The desktop application version does not match this tag."
          }
          $helpOutput = & (Join-Path $releaseRoot "pdf2zh.exe") --help
          if ($LASTEXITCODE -ne 0 -or -not ($helpOutput | Select-String -SimpleMatch "--desktop")) {
              throw "The packaged command-line launcher does not expose --desktop."
          }

          $codexVersion = & $codex --version
          if ($LASTEXITCODE -ne 0 -or -not ($codexVersion | Select-String -SimpleMatch $env:CODEX_VERSION)) {
              throw "Bundled Codex CLI version check failed: $codexVersion"
          }
          $codexHelp = & $codex exec --help
          if ($LASTEXITCODE -ne 0) {
              throw "Bundled Codex CLI exec help failed with exit code $LASTEXITCODE."
          }
          foreach ($option in @("--skip-git-repo-check", "--ephemeral", "--sandbox", "--color", "--output-schema", "--output-last-message")) {
              if (-not ($codexHelp | Select-String -SimpleMatch $option)) {
                  throw "Bundled Codex CLI is missing required option: $option"
              }
          }

      - name: Build EXE installer and checksum
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $releaseRoot = Join-Path $env:GITHUB_WORKSPACE "release-staging\$env:RELEASE_DIRECTORY"
          $distRoot = Join-Path $env:GITHUB_WORKSPACE "release-dist"
          $compilerSetup = Join-Path $env:GITHUB_WORKSPACE "release-dependencies\innosetup.exe"
          $compilerVersionTag = "is-" + $env:INNO_VERSION.Replace('.', '_')
          Invoke-WebRequest -Uri "https://github.com/jrsoftware/issrc/releases/download/$compilerVersionTag/innosetup-$env:INNO_VERSION.exe" -OutFile $compilerSetup
          if ((Get-FileHash $compilerSetup -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:INNO_SHA256) {
              throw "Inno Setup compiler SHA-256 mismatch."
          }
          $compilerRoot = Join-Path $env:GITHUB_WORKSPACE "release-dependencies\inno-setup"
          $installCompiler = Start-Process -FilePath $compilerSetup -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/NOICONS', ('/DIR="' + $compilerRoot + '"')) -Wait -PassThru -WindowStyle Hidden
          if ($installCompiler.ExitCode -ne 0) { throw "Inno Setup installation failed." }
          & .\script\build-windows-installer.ps1 -ReleaseRoot $releaseRoot -ReleaseTag "${{ github.ref_name }}" -OutputRoot $distRoot -Compiler (Join-Path $compilerRoot "ISCC.exe")

      - name: Smoke test the installer in an isolated directory
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Join-Path $env:GITHUB_WORKSPACE "release-dist\$env:RELEASE_ASSET"
          $testRoot = Join-Path $env:RUNNER_TEMP "pdfmathtranslate-installer-test"
          $result = Start-Process -FilePath $installer -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/NOICONS', '/TESTMODE=1', ('/DIR="' + $testRoot + '"')) -Wait -PassThru -WindowStyle Hidden
          if ($result.ExitCode -ne 0) { throw "Installer smoke test failed: $($result.ExitCode)" }
          $help = & (Join-Path $testRoot "pdf2zh.exe") --help
          if ($LASTEXITCODE -ne 0 -or -not ($help | Select-String -SimpleMatch '--desktop')) {
              throw "Installed launcher smoke test failed."
          }
          if (-not (Test-Path (Join-Path $testRoot "unins000.exe"))) { throw "Uninstaller missing." }

      - name: Publish the GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "${{ github.ref_name }}"
          $title = "PDFMathTranslate Codex Edition $tag"
          $archive = Join-Path $env:GITHUB_WORKSPACE "release-dist\$env:RELEASE_ASSET"
          $checksums = Join-Path $env:GITHUB_WORKSPACE "release-dist\SHA256SUMS.txt"
          $notes = Join-Path $env:GITHUB_WORKSPACE "packaging\RELEASE_NOTES.md"

          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
              gh release upload $tag $archive $checksums --clobber --repo $env:GITHUB_REPOSITORY
              if ($LASTEXITCODE -ne 0) { throw "Updating release assets failed." }
              gh release edit $tag --target desktop-app --title $title --notes-file $notes --latest --repo $env:GITHUB_REPOSITORY
              if ($LASTEXITCODE -ne 0) { throw "Updating release metadata failed." }
          }
          else {
              gh release create $tag $archive $checksums --verify-tag --target desktop-app --latest --title $title --notes-file $notes --repo $env:GITHUB_REPOSITORY
              if ($LASTEXITCODE -ne 0) { throw "Creating the GitHub Release failed." }
          }
